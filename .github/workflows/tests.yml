name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - run: find includes mu-plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l wp-performance-inspector.php
      - run: php -l uninstall.php
      - run: php tests/run.php
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:rum
      - run: git diff --exit-code -- assets/vendor
      - run: npm test
